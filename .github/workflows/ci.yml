name: CI

on:
  push:
    branches: [master, 'train/**']
  pull_request:
  workflow_call:
  # The push gate asks whether a change is good. This run asks whether what
  # already landed is still good on today's stable toolchain and runner image:
  # a new rustc or clippy lint can turn a green sha red with no commit here.
  # Without this run that red surfaces at the next unrelated push and reads as
  # that change. Every dependency is pinned by the committed lock, so this run
  # no longer tracks the other CortexKit repos.
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  # A train may supersede an earlier push to that train. Master proofs and
  # scheduled breadth audits must finish, not be cancelled by a later push.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/train/') }}

env:
  CARGO_TERM_COLOR: always
  CK_MUTATE_REV: 0c99c7e16d8ae22b6e114136b6b7b68be6f1394e
  NATS_SERVER_VERSION: "2.15.0"
  NATS_SERVER_SHA256_LINUX_AMD64: 5d2c51caca950333aba84911df7d377f826f3a59ec36061c6539105084f65c92
  NATS_SERVER_SHA256_WINDOWS_AMD64: 2d0861dc2ca3567d17f7d19611d7b346cc2ccbd7086a0a77cc957a2c71663200

jobs:
  # Runners are GitHub-hosted. Blacksmith runners stopped picking up the
  # org's jobs on 2026-10-08 (queued for hours with no runner), so the fleet
  # moved back to GitHub's pool.
  test:
    name: Test (ubuntu)
    runs-on: ubuntu-24.04
    # A wedged test must surface as a fast red run, not burn the runner for
    # the 6-hour Actions default. Healthy runs finish well under 15 minutes.
    timeout-minutes: 20
    env:
      ASTROCYTE_REQUIRE_NATS_SERVER: "1"
    steps:
      - name: Checkout astrocyte
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pinned YAML parser
        run: |
          python3 -m venv "$RUNNER_TEMP/astrocyte-python"
          "$RUNNER_TEMP/astrocyte-python/bin/python" -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      # First, before any toolchain setup: the train-branch preconditions are
      # properties of this file, verified once at adoption and then trusted
      # while the file keeps changing. Drift here fails in seconds rather
      # than surfacing the day protection is enabled against a check that no
      # longer fires. Unpiped on purpose; see the script header.
      - name: Train preconditions still hold
        run: '"$RUNNER_TEMP/astrocyte-python/bin/python" scripts/check_train_preconditions.py'

      # ARCHITECTURE.md and STRUCTURE.md are loaded as context by every agent
      # working here, so a stale path, table or operation in them misleads
      # code changes, not only readers. The check needs only git, Python and
      # SQLite. Unpiped, so its exit status is the step's.
      - name: Overview docs name only things that exist
        run: python3 scripts/check_doc_references.py

      # Internal material lives under .cortexkit/ and stays out of git; only the
      # allowed folders and WORKER.md may be tracked there. The script checks that
      # the ignore block works before trusting it, and exits 2 rather than passing
      # when it doesn't. Unpiped, so its exit status is the step's.
      - name: Nothing internal is tracked under .cortexkit
        run: scripts/check-cortexkit-layout.sh

      - name: Install pinned NATS server
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nats-server.tar.gz"
          directory="$RUNNER_TEMP/astrocyte-nats"
          curl --fail --location --retry 3 \
            "https://github.com/nats-io/nats-server/releases/download/v${NATS_SERVER_VERSION}/nats-server-v${NATS_SERVER_VERSION}-linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$NATS_SERVER_SHA256_LINUX_AMD64" "$archive" | sha256sum --check -
          mkdir -p "$directory"
          tar -xzf "$archive" --strip-components=1 -C "$directory" \
            "nats-server-v${NATS_SERVER_VERSION}-linux-amd64/nats-server"
          echo "$directory" >> "$GITHUB_PATH"
          "$directory/nats-server" --version

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Record Rust compiler for cache
        id: rust-version
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-checks-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-checks-${{ steps.rust-version.outputs.version }}-

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: mutate-cache
        with:
          path: ~/.cargo/bin/ckdev-mutate
          key: ${{ runner.os }}-${{ runner.arch }}-ckdev-mutate-${{ env.CK_MUTATE_REV }}
      - name: Install pinned mutation runner
        if: steps.mutate-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/cortexkit/commons --rev "$CK_MUTATE_REV" cortexkit-mutate

      - name: Validate mutation catalogue
        run: ckdev-mutate check

      # A path dependency on a sibling checkout builds against whatever that
      # checkout holds, so the lock goes stale whenever the sibling moves.
      # Sibling crates come from crates.io; only this repo's crates are path
      # dependencies. Needs cargo, so it runs after the toolchain. Unpiped.
      - name: No path dependency outside the repo
        run: python3 scripts/check-path-deps.py

      - name: Format check
        run: scripts/fmt-check.sh

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets --locked

  # Astrocyte runs on macOS, Linux and Windows. Its readers resolve file
  # identity, paths and SQLite URIs per OS, and a cross-compile proves none of
  # that, so the suite also runs natively on Windows. Mutation replays stay on
  # Linux: they test guards, not platforms.
  test-windows:
    name: Test (windows)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      ASTROCYTE_REQUIRE_NATS_SERVER: "1"
    steps:
      - name: Checkout astrocyte
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned NATS server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'nats-server.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'astrocyte-nats'
          $version = $env:NATS_SERVER_VERSION
          $url = "https://github.com/nats-io/nats-server/releases/download/v${version}/nats-server-v${version}-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actual -ne $env:NATS_SERVER_SHA256_WINDOWS_AMD64) {
            throw 'NATS server archive checksum mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $bin = Join-Path $directory "nats-server-v${version}-windows-amd64"
          $bin >> $env:GITHUB_PATH
          & (Join-Path $bin 'nats-server.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'NATS server version check failed' }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - name: Record Rust compiler for cache
        shell: pwsh
        id: rust-version
        run: |
          $rustVersion = (rustc --version).Split(' ')[1]
          "version=$rustVersion" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-checks-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-checks-${{ steps.rust-version.outputs.version }}-
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets --locked --no-fail-fast

  # No branch/event-dependent job or step if: the train gate must never skip.
  # Select replay scope in the command, while every event runs the same gate.
  mutations:
    name: Mutations (${{ matrix.shard }}/4)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ASTROCYTE_REQUIRE_NATS_SERVER: "1"
    strategy:
      fail-fast: false
      matrix:
        # Four isolated checkouts bound rebuild work per job. This is an initial
        # partition, not an estimate from the much slower shared developer Mac.
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      # Account-isolation controls include a real-durable catch, so replays need NATS too.
      - name: Install pinned NATS server
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nats-server.tar.gz"
          directory="$RUNNER_TEMP/astrocyte-nats"
          curl --fail --location --retry 3 \
            "https://github.com/nats-io/nats-server/releases/download/v${NATS_SERVER_VERSION}/nats-server-v${NATS_SERVER_VERSION}-linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$NATS_SERVER_SHA256_LINUX_AMD64" "$archive" | sha256sum --check -
          mkdir -p "$directory"
          tar -xzf "$archive" --strip-components=1 -C "$directory" \
            "nats-server-v${NATS_SERVER_VERSION}-linux-amd64/nats-server"
          echo "$directory" >> "$GITHUB_PATH"
          "$directory/nats-server" --version
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Record Rust compiler for cache
        id: rust-version
        run: echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      # Reuse the main job's clean-tree build, but never save mutated artifacts.
      - uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-checks-${{ steps.rust-version.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-checks-${{ steps.rust-version.outputs.version }}-

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        id: mutate-cache
        with:
          path: ~/.cargo/bin/ckdev-mutate
          key: ${{ runner.os }}-${{ runner.arch }}-ckdev-mutate-${{ env.CK_MUTATE_REV }}
      - name: Install pinned mutation runner
        if: steps.mutate-cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/cortexkit/commons --rev "$CK_MUTATE_REV" cortexkit-mutate

      - name: Replay guard proofs
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHARD: ${{ matrix.shard }}/4
        run: |
          mkdir -p target/mutations
          rm -f target/mutations/replay.json
          case "$EVENT:$REF" in
            push:refs/heads/train/*)
              git fetch origin master
              ckdev-mutate run --diff origin/master --shard "$SHARD" --report target/mutations/replay.json
              ;;
            schedule:*)
              ckdev-mutate run --all --broad --shard "$SHARD" --report target/mutations/replay.json
              ;;
            *)
              # Pushes to refs/heads/master, pull_request, and workflow_call events run
              # the full replay; only train pushes use the diff-only replay above.
              ckdev-mutate run --all --shard "$SHARD" --report target/mutations/replay.json
              ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutations-${{ github.event_name }}-${{ matrix.shard }}
          path: target/mutations/replay.json
