[workspace]
resolver = "2"
members = [
    "crates/astrocyte-core",
    "crates/astrocyte-module",
    "crates/astrocyte-readers",
]

[workspace.lints.clippy]
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
float_cmp = "deny"
large_stack_arrays = "deny"

# ck-astrocyte — the CortexKit fleet's metering and budget-envelope engine.
#
# Crate split per fleet convention: astrocyte-core is pure domain logic (pricing,
# segment ledger, envelopes, verdicts, anomalies — no subc dependency, fully
# unit-testable); astrocyte-module is the thin subc wire binary (template:
# ai-provider-quota). The subc wire crates (cortexkit/subconscious), the
# shared storage/log/usage primitives (cortexkit/commons) and the catalog wire
# types (fusiform-protocol, cortexkit/fusiform) are exact crates.io pins, so
# the lock resolves the same way on every checkout, with or without those
# repos cloned beside this one.
[workspace.dependencies]
astrocyte-readers = { path = "crates/astrocyte-readers" }
winapi-util = "=0.1.11"
subc-protocol = "=0.33.0"
subc-transport = "=0.14.0"
subc-control = "=0.33.0"
subc-os = "=0.1.19"
subc-client-rs = "=0.32.4"
subc-jsonc = "=0.1.2"

cortexkit-log = "=0.3.5"
cortexkit-paths = "=0.1.2"
tracing = "0.1"

cortexkit-store = { version = "=0.2.4", features = ["sqlite"] }
cortexkit-store-types = "=0.2.2"
cortexkit-provider-usage = "=0.14.0"
# 0.2.8 adds `live_subject`, the plain-publish `live` root runners announce
# finished steps on.
cortexkit-bus-naming = "=0.2.8"
cortexkit-bus-nats = "=0.3.0"
cortexkit-bus-trait = "=0.3.0"
async-nats = { version = "=0.50.0", default-features = false, features = ["jetstream", "kv", "nkeys", "nuid", "ring", "server_2_10"] }
base64 = "=0.22.1"
futures-util = "0.3"
fusiform-protocol = "=0.30.0"
# The `log-read-watermark/v1` wire types (`watermark` module) and the
# `step.finished.v1` live step event (`step_events`, added in 0.7.5).
cortexkit-role-llm-runner = "=0.7.5"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
simd-json = "0.14"
sha2 = "0.10"
ruzstd = "=0.9.1"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"

# The version test hashes the debug executable; optimize SHA-256, not the whole dev build.
[profile.dev.package.sha2]
opt-level = 3
