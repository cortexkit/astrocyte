#
# No row for the generation predicate in the reprice head UPDATE
# (pricing.rs, `WHERE event_id=?3 AND pricing_generation=?4`): replacing it
# with `?4 IS NOT NULL` survives every test. The UPDATE compares against the
# generation read a moment earlier in the same write transaction, so it can
# only differ if that read-back check (row reprice-generation-readback) fails
# first. The predicate is a second fence behind the read-back, not a separate
# guard.

[[control]]
id = "sqlite-memory-statistics-disabled"
guards = "The bundled SQLite build avoids the per-allocation global memory-statistics mutex"
file = ".cargo/config.toml"
old = 'LIBSQLITE3_FLAGS = "-DSQLITE_DEFAULT_MEMSTATUS=0"'
new = 'LIBSQLITE3_FLAGS = "-DSQLITE_DEFAULT_MEMSTATUS=1" # NON-VACUITY BREAK'
test_file = "crates/astrocyte-core/src/store.rs"
runner = "cargo"
package = "astrocyte-core"
target = "--lib"
expect_red = ["store::tests::sqlite_build_disables_per_allocation_memory_statistics"]
expect_message = "SQLite must not take a global memory-statistics mutex on every allocation"
only = true
timeout_s = 600
build_timeout_s = 1800

