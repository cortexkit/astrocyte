
# Replay with ckdev-mutate (cortexkit-mutate 0.9.8) from the immutable CK_MUTATE_REV in ci.yml.
# Rows were appended by `ck-mutate prove` (0.7.0, the runner's earlier name) against the source and named tests,
# then replayed together. Keep this catalogue for silent, costly failures:
# ledger durability, exactly-once ingestion, trust boundaries and wire contracts.
# Ordinary logic belongs in ordinary tests.
# NON-VACUITY BREAK marks a deliberately broken guard. Its named tests must
# exercise the changed path and fail, proving that the original guard is tested.

[[control]]
