new = 'if false && skip_unchanged && tx.total_changes() == before { // NON-VACUITY BREAK'
test_file = "crates/astrocyte-module/src/fast_lane_tests.rs"
runner = "cargo"
package = "astrocyte-module"
target = "--lib"
expect_red = ["refresher::fast_lane_tests::idle_fast_lane_commits_nothing_and_keeps_full_drain_health"]
only = true
timeout_s = 300
build_timeout_s = 600

